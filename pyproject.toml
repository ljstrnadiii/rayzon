[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "rayzon"
version = "0.1.0"
description = "Chunk-first zonal statistics for xarray mosaics and GeoPandas using Ray"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "rayzon contributors" }]
dependencies = [
  "affine>=2.4.0",
  "numpy>=1.26.0",
  "obstore>=0.6",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "pyproj>=3.6.0",
  "rasterio>=1.3.0",
  "ray[default]>=2.53",
  "shapely>=2.0.0",
  "tdigest>=0.5.2.2",
  "zarr>=2.18.0",
]

[project.optional-dependencies]
geopandas = [
  "geopandas>=0.14.0",
]
xarray = [
  "xarray>=2024.2.0",
]
dev = [
  "geopandas>=0.14.0",
  "mypy>=1.10.0",
  "numpydoc>=1.8.0",
  "pre-commit>=3.7.0",
  "pytest>=8.1.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "ipykernel>=7.2.0",
  "xarray>=2024.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rayzon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/rayzon/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): v{version}"
build_command = """
python -m pip install "uv>=0.7,<0.8"
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.numpydoc_validation]
checks = [
  "GL06",
  "GL07",
  "GL10",
  "SS01",
  "SS02",
  "SS03",
  "SS04",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "RT01",
  "RT02",
  "RT03",
]
