[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "rzzs"
version = "0.1.0a0"
description = "Chunk-first zonal statistics for xarray mosaics and GeoPandas using Ray"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "rzzs contributors" }]
dependencies = [
  "affine>=2.4.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "pyproj>=3.6.0",
  "rasterio>=1.3.0",
  "ray[data]>=2.30.0",
  "shapely>=2.0.0",
  "xarray>=2024.2.0",
  "zarr>=2.18.0",
]

[project.optional-dependencies]
geopandas = [
  "geopandas>=0.14.0",
]
dev = [
  "geopandas>=0.14.0",
  "mypy>=1.10.0",
  "numpydoc>=1.8.0",
  "pre-commit>=3.7.0",
  "pytest>=8.1.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "ipykernel>=7.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rzzs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src"]

[tool.numpydoc_validation]
checks = [
  "GL06",
  "GL07",
  "GL10",
  "SS01",
  "SS02",
  "SS03",
  "SS04",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "RT01",
  "RT02",
  "RT03",
]